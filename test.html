<!DOCTYPE html>
<html lang="en">
 
<head>
    <meta charset="UTF - 8">
    <meta name="viewport" content="width=device-width, initial - scale=1.0">
    <title>Hover Message with CSS</title>
    <style>/* (A1) RESPONSIVE IMAGE */






/* (B1) RESPONSIVE IMAGE */
.fimg { width: 100%; }
.fwrap { position: relative; }

/* (B2) POSITION CAPTION */
.fcap {
  position: absolute; top: 0; left: 0;
  width: 100%; height: 100%;
  color: #fff; background: rgba(0, 0, 0, 0.7);
  display: flex; justify-content: center; align-items: center;
}


.fcap {
  visibility: none; opacity: 0;
  transition: opacity 0.3s;
}

.fwrap:hover .fcap {
  visibility: visible; opacity: 1;
}

/* (X) NOT IMPORTANT */

*{box-sizing:border-box;font-family:arial,sans-serif}
body{padding:0;margin:0;border:0;min-height:100vh;display:flex;justify-content:center;align-items:center;background-size:cover;background-position:center;backdrop-filter:blur(10px)}

#cbinfo{margin-top:30px;padding-top:15px;border-top:1px solid #ddd;font-size:13px;font-weight:700}
#cbinfo a{text-decoration:none;padding:5px;color:#fff;background:#a91616}</style>
</head>
 
<body>

  <!-- (X) NOT IMPORTANT -->
  
 
  
  <!-- (B) CENTERED TEXT -->

    <img class="fimg" src="https://images.unsplash.com/photo-1589656966895-2f33e7653819?crop=entropy&cs=srgb&fm=jpg&ixid=M3wzMjM4NDZ8MHwxfHJhbmRvbXx8fHx8fHx8fDE3MDgwOTc1NjV8&ixlib=rb-4.0.3&q=85">
